<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Vasavi – Web Developer</title>

<style>
:root{
  --bg:#0b1c2d;
  --card:#0f1f33;
  --primary:#3b82f6;
  --text:#ffffff;
  --muted:#b9c7d6;
  --border:rgba(255,255,255,0.08);
  --radius:16px;
  --container:1100px;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

.section{padding:clamp(80px,8vw,140px) 0;}
.container{max-width:var(--container);margin:auto;padding:0 24px;}

h1{
  font-size:clamp(40px,5vw,56px);
  text-align:center;
  margin-bottom:12px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  max-width:720px;
  margin:0 auto 64px;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:40px;
}

/* FORM */
form{display:flex;flex-direction:column;gap:20px;}
label{font-size:14px;color:var(--muted);}
input,textarea{
  background:#0b1c2d;
  border:1px solid var(--border);
  color:#fff;
  padding:14px 16px;
  border-radius:12px;
  font-size:15px;
}
textarea{min-height:140px;resize:vertical;}

button{
  background:var(--primary);
  border:none;
  color:#fff;
  padding:16px;
  font-size:16px;
  font-weight:600;
  border-radius:14px;
  cursor:pointer;
}
button:hover{background:#2563eb;}
button:disabled{opacity:.6;cursor:not-allowed;}

.status{display:none;margin-top:16px;font-size:15px;}
.status.success{color:#22c55e;}
.status.error{color:#ef4444;}

/* QUICK CONTACT */
.quick p{color:var(--muted);margin-bottom:24px;}

.action{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px;
  border-radius:14px;
  text-decoration:none;
  color:#fff;
  background:#0b1c2d;
  border:1px solid var(--border);
  margin-bottom:16px;
  transition:.3s;
}
.action:hover{background:#111827;transform:translateY(-2px);}
.action svg{width:22px;height:22px;fill:#fff;flex-shrink:0;}
</style>
</head>

<body>

<!-- HEADER -->
<div id="site-header"></div>
<script src="header.js" defer></script>

<section class="section">
  <div class="container">

    <h1>Let’s Work Together</h1>
    <p class="subtitle">
      I’m Vasavi, a web developer focused on clean UI and practical solutions.
      Have a project or opportunity? Send a message.
    </p>

    <div class="grid">

      <!-- FORM -->
      <div class="card">
        <form id="contactForm">

          <div>
            <label>Name</label>
            <input type="text" name="name" required>
          </div>

          <div>
            <label>Email</label>
            <input type="email" name="email" required>
          </div>

          <div>
            <label>Message</label>
            <textarea name="message" required></textarea>
          </div>

          <input type="text" name="_gotcha" style="display:none">

          <button type="submit">Send Message</button>

          <p id="success" class="status success">Message sent successfully.</p>
          <p id="error" class="status error">Something went wrong.</p>

        </form>
      </div>

      <!-- QUICK CONTACT -->
      <div class="card quick">
        <h3>Quick Contact</h3>
        <p>If you prefer instant communication:</p>

        <!-- PHONE (STANDARD SVG) -->
        <a class="action" href="tel:+919908500325">
          <svg viewBox="0 0 24 24">
            <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1v3.5a1 1 0 01-1 1C9.61 22 2 14.39 2 5a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.59a1 1 0 01-.25 1.01l-2.2 2.19z"/>
          </svg>
          Call Me
        </a>

        <!-- WHATSAPP (OFFICIAL) -->
        <a class="action" href="https://wa.me/919908500325" target="_blank">
          <svg viewBox="0 0 32 32">
            <path d="M16.01 2.01C8.28 2.01 2.01 8.28 2.01 16c0 2.72.78 5.38 2.26 7.67L2 30l6.52-2.14A13.93 13.93 0 0016.01 30c7.72 0 13.99-6.27 13.99-14S23.73 2.01 16.01 2.01zm0 25.58c-2.36 0-4.67-.63-6.68-1.83l-.48-.28-3.87 1.27 1.29-3.77-.31-.49a11.6 11.6 0 01-1.79-6.18c0-6.4 5.21-11.61 11.64-11.61 6.41 0 11.61 5.21 11.61 11.61 0 6.43-5.2 11.64-11.61 11.64z"/>
          </svg>
          WhatsApp
        </a>

        <!-- INSTAGRAM (OFFICIAL) -->
        <a class="action" href="https://www.instagram.com/direct/t/17843739140705999/" target="_blank">
          <svg viewBox="0 0 24 24">
            <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2c1.65 0 3 1.35 3 3v10c0 1.65-1.35 3-3 3H7c-1.65 0-3-1.35-3-3V7c0-1.65 1.35-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.75-.75a1.25 1.25 0 100 2.5 1.25 1.25 0 000-2.5z"/>
          </svg>
          Instagram
        </a>

      </div>

    </div>
  </div>
</section>

<!-- FOOTER -->
<div id="site-footer"></div>
<script src="footer.js" defer></script>

<!-- FORM HANDLER -->
<script>
const form = document.getElementById("contactForm");
const successMsg = document.getElementById("success");
const errorMsg = document.getElementById("error");
const button = form.querySelector("button");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  successMsg.style.display = "none";
  errorMsg.style.display = "none";
  button.disabled = true;

  try{
    const res = await fetch("https://formspree.io/f/mzdbzdej", {
      method: "POST",
      body: new FormData(form),
      headers: { "Accept": "application/json" }
    });
    if(res.ok){
      form.reset();
      successMsg.style.display = "block";
    }else{
      errorMsg.style.display = "block";
    }
  }catch{
    errorMsg.style.display = "block";
  }
  button.disabled = false;
});
</script>

</body>
</html>
